<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Kasbon - Warung Ibu Eti</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: linear-gradient(135deg, #fbfbfa 0%, #f3f4f6 50%, #faf5ff 100%);
            background-size: 200% 200%;
            animation: bgAnimation 12s ease infinite;
            color: #37352f;          
        }
        @keyframes bgAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .btn-press { transition: transform 0.1s ease, background-color 0.15s ease; }
        .btn-press:active { transform: scale(0.97); }
        .notion-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid #e9e9e8;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            transition: all 0.2s ease;
        }
        .notion-card:hover {
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }
        @keyframes spinSlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes spinReverse { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
        .animate-spin-slow { animation: spinSlow 3s linear infinite; }
        .animate-spin-reverse { animation: spinReverse 2s linear infinite; }
        @keyframes bounceDot { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }
        .dot-1 { animation: bounceDot 1.4s infinite ease-in-out both; animation-delay: -0.32s; }
        .dot-2 { animation: bounceDot 1.4s infinite ease-in-out both; animation-delay: -0.16s; }
        .dot-3 { animation: bounceDot 1.4s infinite ease-in-out both; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-slate-200">

    <!-- LAYAR LOADING ADMIN -->
    <div id="splashScreenAdmin" class="fixed inset-0 z-50 flex items-center justify-center bg-[#fbfbfa]/95 backdrop-blur-md transition-opacity duration-500">
        <div class="flex flex-col items-center justify-center space-y-6 text-center">
            <div class="relative w-24 h-24 flex items-center justify-center">
                <div class="absolute inset-0 border-3 border-transparent border-t-amber-500 border-b-rose-500 rounded-full animate-spin-slow"></div>
                <div class="absolute inset-2 border-3 border-transparent border-l-purple-500 border-r-indigo-500 rounded-full animate-spin-reverse"></div>
                <div class="bg-white/90 backdrop-blur-md w-14 h-14 rounded-full shadow-sm border border-slate-200 flex items-center justify-center text-xl font-extrabold text-[#37352f]">
                    👩‍🍳
                </div>
            </div>
            <div class="space-y-2">
                <h1 class="text-xs font-extrabold tracking-widest text-[#37352f] uppercase">
                    SAKEDAP IBU BOS😎
                </h1>
                <p class="text-[10px] text-slate-400 font-medium">Menyiapkan Panel Admin Warung Ibu Eti...</p>
                <div class="flex items-center justify-center space-x-1.5 pt-2">
                    <div class="w-2 h-2 bg-amber-500 rounded-full dot-1"></div>
                    <div class="w-2 h-2 bg-rose-500 rounded-full dot-2"></div>
                    <div class="w-2 h-2 bg-purple-500 rounded-full dot-3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- HEADER ADMIN -->
    <header class="bg-[#fbfbfa]/80 border-b border-[#e9e9e8] py-3 px-4 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-base bg-slate-100 p-1.5 rounded-lg border border-slate-200">🛠️</span>
                <div>
                    <h1 class="text-xs font-bold text-[#37352f] tracking-tight">Admin Kasbon Ibu Eti</h1>
                    <span class="text-[10px] text-slate-400 font-medium">Warung Ibu Eti Management</span>
                </div>
            </div>
            <!-- Tombol ke Halaman User (index.html) -->
            <a href="index.html" target="_blank" class="bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg text-[10px] font-bold btn-press transition flex items-center space-x-1">
                <span>👀</span>
                <span>Lihat Halaman User</span>
            </a>
        </div>
    </header>

    <!-- KONTEN UTAMA ADMIN -->
    <main class="max-w-md w-full mx-auto p-4 flex-grow space-y-4">
        <!-- RINGKASAN TOTAL PIUTANG -->
        <div class="notion-card p-4 bg-gradient-to-br from-white to-amber-50/50 border-amber-200/60 flex items-center justify-between">
            <div class="text-left space-y-0.5">
                <span class="text-[10px] font-bold text-amber-800 uppercase tracking-wider">Total Piutang Aktif</span>
                <h2 id="totalPiutangAngka" class="text-lg font-extrabold text-rose-600">Rp 0</h2>
                <p class="text-[9px] text-slate-400">Total uang dari kasbon yang belum lunas</p>
            </div>
            <div class="text-2xl bg-amber-100 p-2.5 rounded-xl border border-amber-200 shadow-xs">📊</div>
        </div>

        <!-- FORM TAMBAH / EDIT KASBON -->
        <div class="notion-card p-4 space-y-3">
            <div class="flex items-center justify-between border-b border-[#e9e9e8] pb-2">
                <h3 id="formTitle" class="text-xs font-bold text-[#37352f] uppercase tracking-wider">➕ Tambah Kasbon Baru</h3>
                <button type="button" id="btnBatalEdit" onclick="resetForm()" class="text-[10px] text-rose-600 font-bold hover:underline hidden">Batal Edit</button>
            </div>

            <form id="formKasbon" onsubmit="simpanData(event)" class="space-y-3 text-left">
                <input type="hidden" id="editIndex" value="">
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Nama Pelanggan</label>
                    <input type="text" id="nama" required placeholder="Cth: Fahn" class="w-full bg-[#fbfbfa] border border-[#e9e9e8] rounded-lg px-3 py-2 text-xs text-[#37352f] focus:outline-none focus:border-slate-400 focus:bg-white transition">
                </div>
                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Nama Barang</label>
                        <input type="text" id="barang" required placeholder="Cth: Kopi & Roti" class="w-full bg-[#fbfbfa] border border-[#e9e9e8] rounded-lg px-3 py-2 text-xs text-[#37352f] focus:outline-none focus:border-slate-400 focus:bg-white transition">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Nominal (Rp)</label>
                        <input type="number" id="nominal" required placeholder="Cth: 7000" class="w-full bg-[#fbfbfa] border border-[#e9e9e8] rounded-lg px-3 py-2 text-xs text-[#37352f] focus:outline-none focus:border-slate-400 focus:bg-white transition">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">PIN Pelanggan</label>
                        <input type="text" id="kode" required placeholder="Cth: 1234" class="w-full bg-[#fbfbfa] border border-[#e9e9e8] rounded-lg px-3 py-2 text-xs text-[#37352f] focus:outline-none focus:border-slate-400 focus:bg-white transition">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Status Utang</label>
                        <select id="status" class="w-full bg-[#fbfbfa] border border-[#e9e9e8] rounded-lg px-3 py-2 text-xs text-[#37352f] focus:outline-none focus:border-slate-400 focus:bg-white transition">
                            <option value="Belum">Belum Lunas</option>
                            <option value="Lunas">Lunas</option>
                        </select>
                    </div>
                </div>
                <button type="submit" id="btnSubmit" class="w-full bg-[#37352f] text-white font-bold py-2.5 rounded-lg text-xs btn-press hover:bg-black transition shadow-sm mt-1">
                    Simpan Kasbon
                </button>
            </form>
        </div>

        <!-- DAFTAR KASBON -->
        <div class="space-y-3 pt-1">
            <div class="flex items-center justify-between px-1">
                <h3 class="text-xs font-bold text-[#37352f] uppercase tracking-wider">Daftar Kasbon Masuk</h3>
                <span id="jumlahData" class="text-[10px] text-slate-400 font-medium">0 Data</span>
            </div>
            <div class="space-y-2.5" id="listAdmin"></div>
        </div>
    </main>

    <footer class="text-center py-4 text-[10px] text-slate-400 border-t border-[#e9e9e8] bg-[#fbfbfa]/80 mt-6">
        Warung Ibu Eti Admin Panel • 2026
    </footer>

    <script>
        window.onload = function() {
            setTimeout(() => {
                let splash = document.getElementById('splashScreenAdmin');
                splash.style.opacity = '0';
                setTimeout(() => { splash.style.display = 'none'; }, 500);
            }, 1200);
            muatDataAdmin();
        }

        function simpanData(event) {
            event.preventDefault();
            let index = document.getElementById('editIndex').value;
            let namaInput = document.getElementById('nama').value.trim();
            let barangInput = document.getElementById('barang').value.trim();
            let nominalInput = parseFloat(document.getElementById('nominal').value);
            let kodeInput = document.getElementById('kode').value.trim();
            let statusInput = document.getElementById('status').value;

            let databaseKasbon = JSON.parse(localStorage.getItem('databaseKasbonIbuEti')) || [];
            let tanggalHariIni = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });

            if (index === "") {
                let indexSama = databaseKasbon.findIndex(item => 
                    item.nama.toLowerCase() === namaInput.toLowerCase() && item.status === 'Belum'
                );
                if (indexSama !== -1) {
                    databaseKasbon[indexSama].nominal += nominalInput;
                    databaseKasbon[indexSama].barang = `${databaseKasbon[indexSama].barang} + ${barangInput}`;
                    databaseKasbon[indexSama].tanggal = tanggalHariIni;
                    databaseKasbon[indexSama].kode = kodeInput;
                } else {
                    databaseKasbon.unshift({
                        nama: namaInput,
                        barang: barangInput,
                        nominal: nominalInput,
                        kode: kodeInput,
                        status: statusInput,
                        tanggal: tanggalHariIni
                    });
                }
            } else {
                databaseKasbon[index] = {
                    ...databaseKasbon[index],
                    nama: namaInput,
                    barang: barangInput,
                    nominal: nominalInput,
                    kode: kodeInput,
                    status: statusInput
                };
            }

            localStorage.setItem('databaseKasbonIbuEti', JSON.stringify(databaseKasbon));
            resetForm();
            muatDataAdmin();
        }

        function muatDataAdmin() {
            let container = document.getElementById('listAdmin');
            container.innerHTML = '';
            let databaseKasbon = JSON.parse(localStorage.getItem('databaseKasbonIbuEti')) || [];
            document.getElementById('jumlahData').innerText = `${databaseKasbon.length} Data`;

            let totalPiutang = 0;
            databaseKasbon.forEach(item => {
                if (item.status === 'Belum') totalPiutang += Number(item.nominal) || 0;
            });
            document.getElementById('totalPiutangAngka').innerText = `Rp ${totalPiutang.toLocaleString('id-ID')}`;

            if (databaseKasbon.length === 0) {
                container.innerHTML = `<div class="notion-card p-6 text-center space-y-1"><p class="text-lg">📭</p><p class="text-xs text-slate-400 font-medium">Belum ada data kasbon tersimpan.</p></div>`;
                return;
            }

            databaseKasbon.forEach((item, index) => {
                let statusBadge = item.status === 'Belum'
                    ? `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-amber-50 text-amber-700 border border-amber-200">🟡 Belum Lunas</span>`
                    : `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">🟢 Lunas</span>`;

                let card = document.createElement('div');
                card.className = "notion-card p-3.5 space-y-2.5 text-left";
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="text-[10px] text-slate-400 font-medium">${item.tanggal}</span>
                        ${statusBadge}
                    </div>
                    <div class="space-y-1">
                        <div class="flex justify-between items-center">
                            <h4 class="font-bold text-xs text-[#37352f]">${item.nama}</h4>
                            <span class="text-xs font-extrabold text-rose-600">Rp ${Number(item.nominal).toLocaleString('id-ID')}</span>
                        </div>
                        <p class="text-[11px] text-slate-500">Barang: <b class="text-[#37352f]">${item.barang}</b></p>
                        <p class="text-[10px] text-slate-400">PIN Pelanggan: <code class="bg-slate-100 px-1 py-0.5 rounded text-slate-600 font-mono">${item.kode}</code></p>
                    </div>
                    <div class="flex items-center space-x-2 pt-1 border-t border-[#e9e9e8]">
                        <button onclick="editData(${index})" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-1.5 rounded-lg text-[10px] font-bold btn-press transition">✏️ Edit</button>
                        <button onclick="hapusData(${index})" class="flex-1 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 py-1.5 rounded-lg text-[10px] font-bold btn-press transition">🗑️ Hapus</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function editData(index) {
            let databaseKasbon = JSON.parse(localStorage.getItem('databaseKasbonIbuEti')) || [];
            let item = databaseKasbon[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('nama').value = item.nama;
            document.getElementById('barang').value = item.barang;
            document.getElementById('nominal').value = item.nominal;
            document.getElementById('kode').value = item.kode;
            document.getElementById('status').value = item.status;
            document.getElementById('formTitle').innerText = "✏️ Edit Kasbon Pelanggan";
            document.getElementById('btnSubmit').innerText = "Update Perubahan";
            document.getElementById('btnBatalEdit').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('formKasbon').reset();
            document.getElementById('editIndex').value = "";
            document.getElementById('formTitle').innerText = "➕ Tambah Kasbon Baru";
            document.getElementById('btnSubmit').innerText = "Simpan Kasbon";
            document.getElementById('btnBatalEdit').classList.add('hidden');
        }

        function hapusData(index) {
            if (confirm("Yakin ingin menghapus catatan kasbon ini?")) {
                let databaseKasbon = JSON.parse(localStorage.getItem('databaseKasbonIbuEti')) || [];
                databaseKasbon.splice(index, 1);
                localStorage.setItem('databaseKasbonIbuEti', JSON.stringify(databaseKasbon));
                muatDataAdmin();
            }
        }
    </script>
</body>
</html>
