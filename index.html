<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Warung Ibu Eti</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col justify-between text-center selection:bg-slate-200">

    <!-- LAYAR LOADING -->
    <div id="splashScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-[#fbfbfa]/95 backdrop-blur-md transition-opacity duration-500">
        <div class="flex flex-col items-center justify-center space-y-6 text-center">
            <div class="relative w-24 h-24 flex items-center justify-center">
                <div class="absolute inset-0 border-3 border-transparent border-t-amber-500 border-b-rose-500 rounded-full animate-spin-slow"></div>
                <div class="absolute inset-2 border-3 border-transparent border-l-purple-500 border-r-indigo-500 rounded-full animate-spin-reverse"></div>
                <div class="bg-white/90 backdrop-blur-md w-14 h-14 rounded-full shadow-sm border border-slate-200 flex items-center justify-center text-xl font-extrabold text-[#37352f]">
                    🔐
                </div>
            </div>
            <div class="space-y-2">
                <h1 class="text-xs font-extrabold tracking-widest text-[#37352f] uppercase">
                    WILUJENG SUMPING☕
                </h1>
                <p class="text-[10px] text-slate-400 font-medium">Memuat Sistem Login Warung Ibu Eti...</p>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="bg-[#fbfbfa]/80 border-b border-[#e9e9e8] py-3 px-4 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-md mx-auto flex flex-col items-center justify-center space-y-0.5">
            <div class="flex items-center space-x-1.5">
                <span class="text-base bg-slate-100 p-1 rounded-md border border-slate-200">🏪</span>
                <span class="text-base font-bold tracking-tight text-[#37352f]">Warung Ibu Eti</span>
            </div>
            <span class="text-[10px] text-slate-400 font-medium">Portal Masuk Otomatis</span>
        </div>
    </header>

    <!-- KONTEN UTAMA LOGIN -->
    <main class="max-w-md w-full mx-auto p-4 flex-grow flex flex-col justify-center space-y-4">
        <div class="notion-card p-5 space-y-3.5 text-center">
            <h3 class="text-xs font-bold text-[#37352f] uppercase tracking-wider border-b border-[#e9e9e8] pb-2">Login Aplikasi</h3>
            
            <div class="space-y-3 text-left">
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Nama / Akun</label>
                    <input type="text" id="inputNama" placeholder="Ketik 'admin' atau 'user'..." class="w-full bg-[#fbfbfa] border border-[#e9e9e8] rounded-lg px-3 py-2 text-xs text-[#37352f] focus:outline-none focus:border-slate-400 focus:bg-white transition">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">PIN / Sandi</label>
                    <input type="password" id="inputPin" placeholder="Masukkan PIN..." class="w-full bg-[#fbfbfa] border border-[#e9e9e8] rounded-lg px-3 py-2 text-xs text-[#37352f] focus:outline-none focus:border-slate-400 focus:bg-white transition">
                </div>
            </div>

            <div class="bg-amber-50/70 border border-amber-200/60 p-2.5 rounded-lg text-left space-y-1">
                <p class="text-[10px] font-bold text-amber-900">ℹ️ Petunjuk Login:</p>
                <p class="text-[10px] text-amber-800">🛒 Ketik user untuk login (Nama: <code>user</code>, PIN: <code>user</code>)</p>
            </div>

            <div id="pesanError" class="text-[11px] text-rose-600 font-medium hidden"></div>

            <button onclick="cekLoginOtomatis()" class="w-full bg-[#37352f] text-white font-bold py-2.5 rounded-lg text-xs btn-press hover:bg-black transition shadow-sm">
                Masuk 🚀
            </button>
        </div>
    </main>

    <!-- SCRIPT LOGIKA LOGIN -->
    <script>
        window.onload = function() {
            setTimeout(() => {
                let splash = document.getElementById('splashScreen');
                splash.style.opacity = '0';
                setTimeout(() => { splash.style.display = 'none'; }, 500);
            }, 1000);
        }

        function cekLoginOtomatis() {
            let nama = document.getElementById('inputNama').value.trim();
            let pin = document.getElementById('inputPin').value.trim();
            let pesanError = document.getElementById('pesanError');

            if (nama === "" || pin === "") {
                pesanError.innerText = "Nama dan PIN wajib diisi!";
                pesanError.classList.remove('hidden');
                return;
            }

            // CEK LOGIN ADMIN
            const PIN_ADMIN = "eti123"; 
            if (nama.toLowerCase() === "admin" && pin === PIN_ADMIN) {
                sessionStorage.setItem('isAdminLogin', 'true');
                window.location.href = "admin.html"; 
                return;
            }

            // CEK LOGIN USER (DIARAHKAN KE user.html)
            if (nama.toLowerCase() === "user" && pin === "user") {
                sessionStorage.setItem('userAktifIbuEti', 'User Tamu');
                window.location.href = "user.html"; 
                return;
            }

            // Pengecekan dari database kasbon localStorage
            let databaseKasbon = JSON.parse(localStorage.getItem('databaseKasbonIbuEti')) || [];
            let userDitemukan = databaseKasbon.find(item => 
                item.nama.toLowerCase() === nama.toLowerCase() && item.kode === pin
            );

            if (userDitemukan) {
                sessionStorage.setItem('userAktifIbuEti', userDitemukan.nama);
                window.location.href = "user.html"; 
                return;
            }

            pesanError.innerText = "Nama atau PIN salah! Periksa kembali data Anda.";
            pesanError.classList.remove('hidden');
        }
    </script>
</body>
</html>
