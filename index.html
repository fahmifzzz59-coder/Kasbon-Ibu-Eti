<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk Portal - Warung Ibu Eti</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: linear-gradient(135deg, #fbfbfa 0%, #f3f4f6 50%, #faf5ff 100%);
            background-size: 200% 200%;
            animation: bgAnimation 12s ease infinite;
            color: #37352f;          
        }
        @keyframes bgAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .btn-press { transition: transform 0.1s ease, background-color 0.15s ease; }
        .btn-press:active { transform: scale(0.97); }
        .notion-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid #e9e9e8;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            transition: all 0.2s ease;
        }
        .notion-card:hover {
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }
        @keyframes spinSlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes spinReverse { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
        .animate-spin-slow { animation: spinSlow 3s linear infinite; }
        .animate-spin-reverse { animation: spinReverse 2s linear infinite; }
        @keyframes bounceDot { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }
        .dot-1 { animation: bounceDot 1.4s infinite ease-in-out both; animation-delay: -0.32s; }
        .dot-2 { animation: bounceDot 1.4s infinite ease-in-out both; animation-delay: -0.16s; }
        .dot-3 { animation: bounceDot 1.4s infinite ease-in-out both; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-center selection:bg-slate-200">

    <!-- LAYAR LOADING -->
    <div id="splashScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-[#fbfbfa]/95 backdrop-blur-md transition-opacity duration-500">
        <div class="flex flex-col items-center justify-center space-y-6 text-center">
            <div class="relative w-24 h-24 flex items-center justify-center">
                <div class="absolute inset-0 border-3 border-transparent border-t-amber-500 border-b-rose-500 rounded-full animate-spin-slow"></div>
                <div class="absolute inset-2 border-3 border-transparent border-l-purple-500 border-r-indigo-500 rounded-full animate-spin-reverse"></div>
                <div class="bg-white/90 backdrop-blur-md w-14 h-14 rounded-full shadow-sm border border-slate-200 flex items-center justify-center text-xl font-extrabold text-[#37352f]">
                    🔐
                </div>
            </div>
            <div class="space-y-2">
                <h1 class="text-xs font-extrabold tracking-widest text-[#37352f] uppercase">
                    ANTOSAN SAKEDAP😄
                </h1>
                <p class="text-[10px] text-slate-400 font-medium">Menyiapkan Portal Masuk Warung Ibu Eti...</p>
                <div class="flex items-center justify-center space-x-1.5 pt-2">
                    <div class="w-2 h-2 bg-amber-500 rounded-full dot-1"></div>
                    <div class="w-2 h-2 bg-rose-500 rounded-full dot-2"></div>
                    <div class="w-2 h-2 bg-purple-500 rounded-full dot-3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="bg-[#fbfbfa]/80 border-b border-[#e9e9e8] py-3 px-4 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-md mx-auto flex flex-col items-center justify-center space-y-0.5">
            <div class="flex items-center space-x-1.5">
                <span class="text-base bg-slate-100 p-1 rounded-md border border-slate-200">🏪</span>
                <span class="text-base font-bold tracking-tight text-[#37352f]">Portal Kasbon Warung Ibu Eti</span>
            </div>
            <span class="text-[10px] text-slate-400 font-medium">Sistem Verifikasi Otomatis Admin & User</span>
        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="max-w-md w-full mx-auto p-4 flex-grow space-y-4 text-center">

        <div class="space-y-4 pt-4">
            <div class="bg-[#f1f3f5] border border-[#d8dee4] p-3.5 rounded-xl text-left flex items-start space-x-2.5">
                <span class="text-base flex-shrink-0">💡</span>
                <p class="text-[11px] text-[#37352f] leading-relaxed">
                    Masukkan nama dan PIN. Sistem akan otomatis mendeteksi apakah kamu sebagai <b>Admin</b> atau <b>Pelanggan</b>.
                </p>
            </div>

            <div class="notion-card p-5 space-y-3.5 text-center">
                <h3 class="text-xs font-bold text-[#37352f] uppercase tracking-wider border-b border-[#e9e9e8] pb-2">Masuk ke Sistem</h3>
                
                <div class="space-y-3 text-left">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Nama (Ketik "Admin" atau Nama Pelanggan)</label>
                        <input type="text" id="inputNama" placeholder="Cth: Admin atau Fahn" class="w-full bg-[#fbfbfa] border border-[#e9e9e8] rounded-lg px-3 py-2 text-xs text-[#37352f] focus:outline-none focus:border-slate-400 focus:bg-white transition">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">PIN / Kata Sandi</label>
                        <input type="password" id="inputPin" placeholder="Masukkan PIN..." class="w-full bg-[#fbfbfa] border border-[#e9e9e8] rounded-lg px-3 py-2 text-xs text-[#37352f] focus:outline-none focus:border-slate-400 focus:bg-white transition">
                    </div>
                </div>

                <div id="pesanError" class="text-[11px] text-rose-600 font-medium hidden"></div>

                <button onclick="prosesLoginOtomatis()" class="w-full bg-[#37352f] text-white font-bold py-2.5 rounded-lg text-xs btn-press hover:bg-black transition shadow-sm">
                    Masuk Otomatis 🚀
                </button>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="text-center py-4 text-[10px] text-slate-400 border-t border-[#e9e9e8] bg-[#fbfbfa]/80 mt-6">
        Warung Ibu Eti Portal Utama • 2026
    </footer>

    <!-- SCRIPT -->
    <script>
        window.onload = function() {
            setTimeout(() => {
                let splash = document.getElementById('splashScreen');
                splash.style.opacity = '0';
                setTimeout(() => { splash.style.display = 'none'; }, 500);
            }, 1200);
        }

        function prosesLoginOtomatis() {
            let nama = document.getElementById('inputNama').value.trim();
            let pin = document.getElementById('inputPin').value.trim();
            let pesanError = document.getElementById('pesanError');

            if (nama === "" || pin === "") {
                pesanError.innerText = "Nama dan PIN wajib diisi!";
                pesanError.classList.remove('hidden');
                return;
            }

            // PIN KHUSUS ADMIN (Bisa diubah sesuai keinginan)
            const PIN_ADMIN_RAHASIA = "eti123"; 

            // Cek apakah login sebagai Admin
            if (nama.toLowerCase() === "admin" && pin === PIN_ADMIN_RAHASIA) {
                sessionStorage.setItem('isAdminLogin', 'true');
                window.location.href = "admin.html";
                return;
            }

            // Cek ke database kasbon apakah sebagai Pelanggan
            let databaseKasbon = JSON.parse(localStorage.getItem('databaseKasbonIbuEti')) || [];
            let userDitemukan = databaseKasbon.find(item => item.nama.toLowerCase() === nama.toLowerCase() && item.kode === pin);

            if (userDitemukan) {
                sessionStorage.setItem('userAktifIbuEti', userDitemukan.nama);
                window.location.href = "user.html";
                return;
            }

            // Jika gagal
            pesanError.innerText = "Nama atau PIN salah! Periksa kembali data Anda.";
            pesanError.classList.remove('hidden');
        }
    </script>
</body>
</html>
